name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Run unit tests
        run: dotnet test tests\Unit\NativeScreenDimmer.WinUI3.Tests\NativeScreenDimmer.WinUI3.Tests.csproj --configuration Release

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Publish (win-${{ matrix.arch }})
        run: >
          dotnet publish NativeScreenDimmer.WinUI3.csproj
          -c Release
          -r win-${{ matrix.arch }}
          -p:Platform=${{ matrix.arch }}
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o publish\win-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoirLumen-win-${{ matrix.arch }}
          path: publish\win-${{ matrix.arch }}
          retention-days: 30
