name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Run unit tests
        run: dotnet test tests\Unit\NativeScreenDimmer.WinUI3.Tests\NativeScreenDimmer.WinUI3.Tests.csproj --configuration Release

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Publish (win-${{ matrix.arch }})
        run: >
          dotnet publish NativeScreenDimmer.WinUI3.csproj
          -c Release
          -r win-${{ matrix.arch }}
          -p:Platform=${{ matrix.arch }}
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o publish\win-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoirLumen-win-${{ matrix.arch }}
          path: publish\win-${{ matrix.arch }}
          retention-days: 30

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish\win-${{ matrix.arch }}\* -DestinationPath NoirLumen-${{ github.ref_name }}-win-${{ matrix.arch }}.zip

      - name: Upload release zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-${{ matrix.arch }}
          path: NoirLumen-${{ github.ref_name }}-win-${{ matrix.arch }}.zip
          retention-days: 1

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release zips
        uses: actions/download-artifact@v4
        with:
          pattern: release-zip-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
